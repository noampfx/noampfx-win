name: Build Windows (NoAmp FX)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---- 1) native engine: noamp.dll (MinGW-w64 GCC, fully static)
      - name: Build noamp.dll
        shell: bash
        run: |
          gcc --version
          cmake -S native -B native/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release -j 4
          mkdir -p resources/windows-x64
          cp native/build/noamp.dll resources/windows-x64/noamp.dll
          ls -l resources/windows-x64

      # ---- 2) portable app folder (NoAmpFX.exe + runtime + noamp.dll), no installer tools needed
      - name: Build portable app
        run: gradle createDistributable --no-daemon

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/NoAmpFX/* -DestinationPath NoAmpFX-portable-windows.zip

      # ---- 3) installer (.exe) – needs WiX 3 which is preinstalled on the runner; do not fail the whole build if it is missing
      - name: Build installer
        continue-on-error: true
        run: gradle packageExe --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NoAmpFX-portable
          path: NoAmpFX-portable-windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NoAmpFX-installer
          path: build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noamp-dll
          path: resources/windows-x64/noamp.dll
          if-no-files-found: warn
